<!DOCTYPE html>
<html>
<head>
    <title>Image Map Example</title>
</head>
<body>

<h2>Image Map</h2>

<img src="./Hashiras.jpg" alt="Hashiras" usemap="#Hashiras" width="600" height="400">

<map name="Hashiras">
    <area shape="rect" coords="20,20,120,120" href="./rect.html" alt="Rectangle" title="Rectangle">
    <area shape="circle" coords="200,80,40" href="./circle.html" alt="Circle" title="Circle">
    <area shape="poly" coords="300,20,350,80,320,140,260,100" href="./poly.html" alt="Polygon" title="Polygon">
</map>

</body>
</html>
