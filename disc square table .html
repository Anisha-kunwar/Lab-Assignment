<!DOCTYPE html>
<html>
<head>
    <title>Table</title>
</head>
<body>
     <table border="1" width="100%" cellpadding="10">
        <tr>
           <th>Style disc</th>
           <th>Style square</th>
           <th>Style circle</th>
        </tr>
    
        <td>
            <ul style="list-style-type:disc;">
                <li>Friday</li>
                <li>Monday</li>
                <li>Saturday</li>
                <li>Wednesday</li>
            </ul>
        </td>
        <td>
            <ul style="list-style-type:square;">
                <li>Friday</li>
                <li>Monday</li>
                <li>Saturday</li>
                <li>Wednesday</li>
            </ul>
        </td>
        <td>
            <ul style="list-style-type:circle;">
                <li>Friday</li>
                <li>Monday</li>
                <li>Saturday</li>
                <li>Wednesday</li>
            </ul>
        </td>
    </tr>
</table>
