<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <title>लोक सेवा आयोग लग-इन</title>
    <link rel="stylesheet" href="./21.Loksewa.css">

</head>
<body>

<div class="container">

    <!-- Left Section -->
    <div class="left">
        <h2>प्रदेश लोक सेवा आयोग</h2>
        <p>प्रणालीमा नयाँ प्रयोगकर्ता दर्ता गर्न दर्ता गर्नुहोस्।</p>

        <ul>
            <li>✔ व्यक्तिगत विवरण सही प्रविष्ट गर्नुहोस्</li>
            <li>✔ इमेल र मोबाइल नम्बर मान्य हुनुपर्छ</li>
            <li>✔ पासवर्ड सुरक्षित राख्नुहोस्</li>
        </ul>
    </div>


    <div class="logo">
    <img src="./lok.jpg" alt="Lok Sewa Logo">
</div>


    <!-- Right Section -->
    <div class="right">
        <h2>लग-इन</h2>

        <label>प्रयोगकर्ता नाम</label>
        <input type="text" placeholder="प्रयोगकर्ता नाम">

        <label>पासवर्ड</label>
        <input type="password" placeholder="पासवर्ड">

        <button class="login">लग-इन</button>

        <p class="register">नयाँ प्रयोगकर्ता ?
            <span>दर्ता गर्नुहोस्</span>
        </p>
    </div>

</div>

</body>
</html>
