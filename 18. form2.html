<!DOCTYPE html>
<html>
<head>
    <title>Registration Form</title>
    <link rel="stylesheet" href="./18. form2.css">
</head>
<body>

<h2>Registration Form</h2>

<form>
    <fieldset>
        <legend>Personal Details</legend>

        <table>
            <tr>
                <td>Name</td>
                <td><input type="text" placeholder="Enter Name"></td>
            </tr>

            <tr>
                <td>Address</td>
                <td><input type="text"></td>
            </tr>

            <tr>
                <td>Phone</td>
                <td><input type="text"></td>
            </tr>

            <tr>
                <td>Gender</td>
                <td>
                    <input type="radio" name="g"> Male
                    <input type="radio" name="g"> Female
                </td>
            </tr>

            <tr>
                <td>Country</td>
                <td>
                    <select>
                        <option>Select Country</option>
                        <option>Nepal</option>
                        <option>India</option>
                    </select>
                </td>
            </tr>

            <tr>
                <td>Message</td>
                <td><textarea></textarea></td>
            </tr>

            <tr>
                <td>Image</td>
                <td><input type="file"></td>
            </tr>

            <tr>
                <td colspan="2">
                    <input type="checkbox"> I Accept Term & Condition
                </td>
            </tr>

            <tr>
                <td>
                    <input type="submit" value="Register" class="btn">
                </td>
                <td>
                    <input type="reset" value="Clear" class="btn clear">
                </td>
            </tr>
        </table>

    </fieldset>
</form>

</body>
</html>
