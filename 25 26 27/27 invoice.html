<!DOCTYPE html>
<html>
<head>
    <title>Invoice</title>
    <link rel="stylesheet" href="./27 invoice.css">
</head>
<body>

<div class="invoice">

    <!-- Top Header -->
    <div class="top">
        <div class="logo">
            <div class="circle">LOGO</div>
            <p>Your Company Name<br>
            your@email.com</p>
        </div>

        <div class="invoice-title">
            <h2>INVOICE</h2>
            <p>Date: 02/01/2026<br>
            Invoice No: 001</p>
        </div>
    </div>

    <!-- Billing Info -->
    <div class="info">
        <div>
            <strong>BILL TO</strong><br>
            Client Company Name<br>
            Address<br>
            Phone
        </div>

        <div>
            <strong>SHIP TO</strong><br>
            Client Company Name<br>
            Address<br>
            Phone
        </div>
    </div>

    <!-- Table -->
    <table>
        <tr class="head">
            <th>Description</th>
            <th>Qty</th>
            <th>Unit Price</th>
            <th>Total</th>
        </tr>

        <tr>
            <td>Web Design</td>
            <td>1</td>
            <td>5000</td>
            <td>5000</td>
        </tr>

        <tr>
            <td>Hosting</td>
            <td>1</td>
            <td>2000</td>
            <td>2000</td>
        </tr>
    </table>

    <!-- Summary -->
    <div class="summary">
        <p>Subtotal: Rs. 7000</p>
        <p>Tax: Rs. 0</p>
        <h3>Balance Due: Rs. 7000</h3>
    </div>

    <!-- Footer Line -->
    <div class="footer"></div>

</div>

</body>
</html>
