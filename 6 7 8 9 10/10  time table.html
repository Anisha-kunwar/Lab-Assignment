<!DOCTYPE html>
<html>
<head>
    <title>Time Table</title>
</head>
<body>

<h2 align="center">Time Table</h2>

<table border="2" cellspacing="0" cellpadding="10" align="center">
    <tr>
        <th rowspan="2">Hours</th>
        <th>Mon</th>
        <th>Tue</th>
        <th>Wed</th>
        <th>Thu</th>
        <th>Fri</th>
    </tr>

    <tr>
        <td>Math</td>
        <td>Science</td>
        <td>Math</td>
        <td>Science</td>
        <td>Arts</td>
    </tr>

    <tr>
        <td rowspan="2"></td>
        <td>Math</td>
        <td>Science</td>
        <td>Math</td>
        <td>Science</td>
        <td>Arts</td>
    </tr>

    <tr>
        <td colspan="5">Lunch</td>
    </tr>

    <tr>
        <td></td>
        <td>Math</td>
        <td>Science</td>
        <td>Math</td>
        <td colspan="2" rowspan="2">Project</td>
    </tr>

    <tr>
        <td></td>
        <td>Math</td>
        <td>Science</td>
        <td>Math</td>
    </tr>
</table>

</body>
</html>
